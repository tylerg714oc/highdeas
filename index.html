<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Highdeas</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Space+Grotesk:wght@400..700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .smoke-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 9999;
            background-image: repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,0.02) 0%, rgba(0,0,0,0.02) 2px);
            opacity: 0.1;
        }
        .glass-card {
            background-color: rgba(37, 61, 44, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(112, 128, 144, 0.2);
            box-shadow: 0 0 15px rgba(27, 48, 34, 0.4);
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            transform: scale(1.02);
            backdrop-filter: blur(24px);
            border-color: rgba(212, 175, 55, 0.5);
        }
        .btn-pulse { animation: pulse-glow 2s infinite alternate; }
        @keyframes pulse-glow {
            from { box-shadow: 0 0 5px rgba(255, 191, 0, 0.4); }
            to { box-shadow: 0 0 15px rgba(255, 191, 0, 0.8); }
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error": "#ffb4ab",
                        "outline": "#8d928c",
                        "surface-container-high": "#1c2b39",
                        "background": "#041521",
                        "error-container": "#93000a",
                        "on-surface": "#d4e4f6",
                        "surface-container-low": "#0d1d2a",
                        "primary": "#b4cdb8",
                        "secondary-container": "#ffbf00",
                        "surface-container": "#11212e",
                        "surface-variant": "#273644",
                        "tertiary": "#e9c349",
                        "on-background": "#d4e4f6",
                        "on-primary": "#203527",
                        "outline-variant": "#434843",
                        "surface-container-highest": "#273644",
                        "surface": "#041521",
                        "on-surface-variant": "#c3c8c1",
                        "primary-container": "#1b3022",
                        "secondary": "#ffe2ab"
                    },
                    "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                    "spacing": { "margin-mobile": "16px" },
                    "fontFamily": {
                        "label-sm": ["Space Grotesk"],
                        "body-lg": ["Space Grotesk"],
                        "body-md": ["Space Grotesk"],
                        "headline-lg-mobile": ["Bricolage Grotesque"],
                        "label-md": ["Space Grotesk"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "1.2", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background min-h-screen pb-24 relative overflow-x-hidden">
<div class="smoke-overlay"></div>

<header class="fixed top-0 w-full z-40 bg-surface/40 backdrop-blur-xl border-b border-outline-variant/20 shadow-[0_4px_20px_rgba(27,48,34,0.4)] flex justify-between items-center px-margin-mobile h-16">
<div class="flex items-center gap-3">
<img alt="Highdeas Logo" class="w-10 h-10 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCTaMhIlSOvIvRVm7K9v79ZBT2HO0Y2O_JSAcMZcPGopYfEjbyov_ZvJ5nE5jVwjf01GNIcDZ63OJSAF-OGnW-SVmUHsr7mLnlqWeaBpj8A6s5hZW-v30lfeDMNkLKaySRJJUo8T6Jmv07Ww5udf2TwzMyKy72J1kj5pf_z5RJrn-gaWYU58b-q0EF1KigA2GvVT1WGPrBghHK0k1-Q94Ds1l8iaTUza3CXRLxRQmhDa4zEZTAEw6dIkn5VOeLg8xLAuXv13Hly9Q4"/>
<h1 class="text-headline-lg-mobile tracking-tight font-black" style="letter-spacing: -0.05em; color: #fbbc00;">Highdeas</h1>
</div>
</header>

<main class="pt-20 px-margin-mobile flex flex-col gap-6 max-w-xl mx-auto">
<div class="flex flex-col items-center justify-center py-6 px-margin-mobile text-center">
<p class="text-headline-lg-mobile text-secondary-container" style="font-family: 'Bricolage Grotesque'; text-shadow: 0 0 12px rgba(251, 188, 0, 0.4);">
        &ldquo;Reality is just a collective hallucination we all agreed on.&rdquo;
</p>
<div class="h-1 w-16 bg-secondary-container/20 rounded-full mt-4"></div>
</div>

<section id="feed" class="flex flex-col gap-6">
<p id="loading" class="text-center text-on-surface-variant py-8">Loading ideas...</p>
</section>
</main>

<button onclick="openModal()" class="fixed bottom-8 right-6 w-14 h-14 bg-secondary-container text-primary-container rounded-full flex items-center justify-center shadow-lg btn-pulse z-40">
<span class="material-symbols-outlined text-[28px]">add</span>
</button>

<div id="modal" class="fixed inset-0 z-50 items-center justify-center bg-black/60 backdrop-blur-sm px-4" style="display:none;">
<div class="glass-card rounded-xl p-6 w-full max-w-md flex flex-col gap-4" style="background-color: rgba(17, 33, 46, 0.95);">
<div class="flex justify-between items-center">
<h2 class="text-xl font-bold text-secondary-container" style="font-family: 'Bricolage Grotesque';">Spark a Thought</h2>
<button onclick="closeModal()" class="text-on-surface-variant hover:text-error transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<input id="titleInput" type="text" placeholder="Title (optional)" class="w-full bg-surface-container-low border border-outline-variant/40 rounded-lg p-3 text-on-surface placeholder:text-on-surface-variant/50 focus:border-secondary-container focus:ring-0 outline-none"/>
<textarea id="contentInput" rows="4" placeholder="What's on your mind? (keep it hazy...)" class="w-full bg-surface-container-low border border-outline-variant/40 rounded-lg p-3 text-on-surface placeholder:text-on-surface-variant/50 focus:border-secondary-container focus:ring-0 outline-none resize-none"></textarea>
<button onclick="submitPost()" id="submitBtn" class="w-full bg-secondary-container text-primary-container font-bold py-3 rounded-lg flex items-center justify-center gap-2 hover:opacity-90 transition-opacity">
<span class="material-symbols-outlined text-[20px]">rocket_launch</span>
Post Highdea
</button>
</div>
</div>

<script>
const SUPABASE_URL = 'https://nfqxflrftqcrueywyoel.supabase.co';
const SUPABASE_KEY = 'sb_publishable_xTsRjuOb3tmzEYz9Lo9X9Q_o3UofqfH';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function timeAgo(dateString) {
    const seconds = Math.floor((new Date() - new Date(dateString)) / 1000);
    if (seconds < 60) return 'just now';
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return minutes + 'm ago';
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return hours + 'h ago';
    const days = Math.floor(hours / 24);
    return days + 'd ago';
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

async function loadPosts() {
    const { data, error } = await db
        .from('posts')
        .select('*')
        .order('upvotes', { ascending: false });

    const feed = document.getElementById('feed');
    if (error) {
        feed.innerHTML = '<p class="text-center text-error py-8">Could not load ideas. Refresh to try again.</p>';
        return;
    }
    if (!data || data.length === 0) {
        feed.innerHTML = '<p class="text-center text-on-surface-variant py-8">No ideas yet. Be the first to spark one! Tap the + button.</p>';
        return;
    }

    feed.innerHTML = data.map(function(post) {
        return '<article class="glass-card rounded-xl p-5 flex flex-col gap-4">' +
            '<div class="flex justify-between items-start">' +
                '<div class="flex items-center gap-3">' +
                    '<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center border border-outline-variant/50">' +
                        '<span class="material-symbols-outlined text-primary">cruelty_free</span>' +
                    '</div>' +
                    '<div class="flex flex-col">' +
                        '<span class="text-label-md text-primary">' + escapeHtml(post.author || 'Anonymous') + '</span>' +
                        '<span class="text-label-sm text-on-surface-variant">' + timeAgo(post.created_at) + '</span>' +
                    '</div>' +
                '</div>' +
            '</div>' +
            '<div class="py-2">' +
                (post.title ? '<h3 class="text-headline-lg-mobile text-on-surface mb-2">' + escapeHtml(post.title) + '</h3>' : '') +
                '<p class="text-body-lg text-on-surface-variant/90">' + escapeHtml(post.content) + '</p>' +
            '</div>' +
            '<div class="flex items-center justify-between border-t border-outline-variant/20 pt-4 mt-2">' +
                '<div class="flex items-center gap-1 bg-surface-container-high rounded-full p-1 border border-outline-variant/30">' +
                    '<button onclick="vote(' + post.id + ', \'up\')" class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-primary-container hover:text-primary transition-colors text-on-surface-variant">' +
                        '<span class="material-symbols-outlined text-[20px]">thumb_up</span>' +
                    '</button>' +
                    '<span class="text-label-md text-on-surface px-2">' + (post.upvotes - post.downvotes) + '</span>' +
                    '<button onclick="vote(' + post.id + ', \'down\')" class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-error-container hover:text-error transition-colors text-on-surface-variant">' +
                        '<span class="material-symbols-outlined text-[20px]">thumb_down</span>' +
                    '</button>' +
                '</div>' +
            '</div>' +
        '</article>';
    }).join('');
}

async function vote(id, direction) {
    const { data } = await db.from('posts').select('upvotes, downvotes').eq('id', id).single();
    if (!data) return;
    if (direction === 'up') {
        await db.from('posts').update({ upvotes: data.upvotes + 1 }).eq('id', id);
    } else {
        await db.from('posts').update({ downvotes: data.downvotes + 1 }).eq('id', id);
    }
    loadPosts();
}

function openModal() {
    document.getElementById('modal').style.display = 'flex';
}
function closeModal() {
    document.getElementById('modal').style.display = 'none';
    document.getElementById('titleInput').value = '';
    document.getElementById('contentInput').value = '';
}

async function submitPost() {
    const title = document.getElementById('titleInput').value.trim();
    const content = document.getElementById('contentInput').value.trim();
    if (!content) {
        alert('Please write your idea first!');
        return;
    }
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = 'Posting...';

    const { error } = await db.from('posts').insert({
        title: title || null,
        content: content,
        author: 'Anonymous'
    });

    btn.disabled = false;
    btn.innerHTML = '<span class="material-symbols-outlined text-[20px]">rocket_launch</span> Post Highdea';

    if (error) {
        alert('Something went wrong. Try again.');
        return;
    }
    closeModal();
    loadPosts();
}

loadPosts();
</script>
</body>
</html>
